<!doctype html>
<html lang="en" data-theme="light" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ApexGMVOS</title>
    <meta name="description" content="ApexGMV reporting & operations dashboard." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f6f8" />

    <!-- Apply the saved theme before first paint. Without this the document
         renders light for a frame before React mounts, which reads as a white
         flash for dark-mode users. Kept in sync with src/theme/ThemeContext. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ac_theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.dataset.theme = t;
          document.documentElement.setAttribute('data-bs-theme', t);
          if (t === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ApexGMVOS" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
